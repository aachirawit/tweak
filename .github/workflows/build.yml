name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two products ship from this tree and a change can break one without
        # touching the other, so both are built rather than only the default.
        brand: [numbanine, less]
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # clang-format's output changes between major versions, so the check is
      # only meaningful when everyone runs the same one. The runner's Visual
      # Studio ships a different version from the one this repository is
      # formatted with, which makes correctly formatted code fail here. Pinned
      # explicitly instead; format-source.ps1 prefers a clang-format on PATH,
      # which is where pip puts this.
      - name: Pin clang-format
        if: matrix.brand == 'numbanine' && matrix.configuration == 'Release'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check clang-format==22.1.3
          clang-format --version

      # Formatting is the same source whichever brand is being built, so one
      # job checks it instead of all four reporting the same violation.
      - name: Verify formatting
        if: matrix.brand == 'numbanine' && matrix.configuration == 'Release'
        shell: pwsh
        run: .\scripts\format-source.ps1 -Check

      - name: Build
        shell: pwsh
        run: .\scripts\build.ps1 -Configuration ${{ matrix.configuration }} -Brand ${{ matrix.brand }}

      - name: Package release
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: >-
          .\scripts\package-release.ps1 -Version 0.1.0 -Brand ${{ matrix.brand }}
          -SkipBuild -ValidateStartup

      - name: Name the package
        if: matrix.configuration == 'Release'
        id: package
        shell: pwsh
        run: |
          $target = if ("${{ matrix.brand }}" -eq "less") { "Less" } else { "numbanine" }
          "name=$target-0.1.0-win64" >> $env:GITHUB_OUTPUT

      - name: Upload release package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            artifacts/releases/${{ steps.package.outputs.name }}.zip
            artifacts/releases/${{ steps.package.outputs.name }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
