name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Verify formatting
        shell: pwsh
        run: .\scripts\format-source.ps1 -Check

      - name: Build
        shell: pwsh
        run: .\scripts\build.ps1 -Configuration ${{ matrix.configuration }}

      - name: Package release
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version 0.1.0 -SkipBuild -ValidateStartup

      - name: Upload release package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SZK-0.1.0-win64
          path: |
            artifacts/releases/SZK-0.1.0-win64.zip
            artifacts/releases/SZK-0.1.0-win64.zip.sha256
          if-no-files-found: error
          retention-days: 14
